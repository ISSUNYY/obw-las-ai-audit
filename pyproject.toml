[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obw-las-ai-audit"
version = "0.1.0"
description = "Conversão e controle de qualidade de arquivos LAS para perfis de poço."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Davi Farias Dias" }]
keywords = ["las", "well-logs", "data-quality", "petroleum-engineering"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Repository = "https://github.com/ISSUNYY/obw-las-ai-audit"
Issues = "https://github.com/ISSUNYY/obw-las-ai-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/obw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "tmp/ruff-cache"
